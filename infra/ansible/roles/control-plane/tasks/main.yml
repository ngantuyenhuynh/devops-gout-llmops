- name: Initialize Kubernetes control plane
  shell: >
    kubeadm init
    --pod-network-cidr={{ pod_cidr }}
    --apiserver-advertise-address={{ ansible_default_ipv4.address }}
  args:
    creates: /etc/kubernetes/admin.conf

- name: Set up kubectl for root
  shell: |
    mkdir -p $HOME/.kube
    cp /etc/kubernetes/admin.conf $HOME/.kube/config
    chown $(id -u):$(id -g) $HOME/.kube/config
  args:
    creates: /root/.kube/config

- name: Wait for API server to be ready
  shell: kubectl get nodes
  register: result
  retries: 20
  delay: 10
  until: result.rc == 0
  changed_when: false

- name: Install Flannel CNI
  shell: kubectl apply -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
  changed_when: true

- name: Wait for Flannel pods to be running
  shell: kubectl wait --for=condition=ready pod -l app=flannel -n kube-flannel --timeout=120s
  changed_when: false

- name: Get kubeadm join command
  shell: kubeadm token create --print-join-command
  register: join_command
  changed_when: false

- name: Set join command as fact
  set_fact:
    k8s_join_command: "{{ join_command.stdout }}"

- name: Fetch kubeconfig to local machine
  fetch:
    src: /etc/kubernetes/admin.conf
    dest: /tmp/kubeconfig
    flat: true

- name: Replace internal IP with external IP in kubeconfig
  delegate_to: localhost
  replace:
    path: /tmp/kubeconfig
    regexp: "https://{{ ansible_default_ipv4.address }}:6443"
    replace: "https://{{ ansible_host }}:6443"
