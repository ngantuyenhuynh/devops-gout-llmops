- name: Initialize Kubernetes control plane
  shell: >
    kubeadm init
    --pod-network-cidr={{ pod_cidr }}
    --apiserver-advertise-address={{ ansible_default_ipv4.address }}
    --apiserver-cert-extra-sans={{ ansible_host }}
  args:
    creates: /etc/kubernetes/admin.conf

# Nếu cluster đã tồn tại nhưng cert thiếu external IP, regenerate
- name: Check if external IP is in API server cert SANs
  shell: openssl x509 -in /etc/kubernetes/pki/apiserver.crt -noout -text | grep -q {{ ansible_host }}
  register: cert_check
  failed_when: false
  changed_when: false

- name: Regenerate API server cert with external IP if missing
  shell: |
    rm /etc/kubernetes/pki/apiserver.crt /etc/kubernetes/pki/apiserver.key
    kubeadm init phase certs apiserver \
      --apiserver-advertise-address={{ ansible_default_ipv4.address }} \
      --apiserver-cert-extra-sans={{ ansible_host }}
    crictl rm $(crictl ps -a --name kube-apiserver -q)
    sleep 15
  when: cert_check.rc != 0

- name: Set up kubectl for root
  shell: |
    mkdir -p $HOME/.kube
    cp /etc/kubernetes/admin.conf $HOME/.kube/config
    chown $(id -u):$(id -g) $HOME/.kube/config
  args:
    creates: /root/.kube/config

- name: Wait for API server to be ready
  shell: kubectl get nodes
  register: result
  retries: 20
  delay: 10
  until: result.rc == 0
  changed_when: false

- name: Install Flannel CNI
  shell: kubectl apply -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
  changed_when: true

- name: Wait for Flannel pods to be running
  shell: kubectl wait --for=condition=ready pod -l app=flannel -n kube-flannel --timeout=120s
  changed_when: false

- name: Get kubeadm join command
  shell: kubeadm token create --print-join-command
  register: join_command
  changed_when: false

- name: Set join command as fact
  set_fact:
    k8s_join_command: "{{ join_command.stdout }}"

- name: Fetch kubeconfig to local machine
  fetch:
    src: /etc/kubernetes/admin.conf
    dest: /tmp/kubeconfig
    flat: true

- name: Replace internal IP with external IP in kubeconfig
  delegate_to: localhost
  replace:
    path: /tmp/kubeconfig
    regexp: "https://{{ ansible_default_ipv4.address }}:6443"
    replace: "https://{{ ansible_host }}:6443"
