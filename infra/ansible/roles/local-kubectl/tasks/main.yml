- name: Create ~/.kube directory
  file:
    path: "{{ lookup('env', 'HOME') }}/.kube"
    state: directory
    mode: "0755"

- name: Install kubeconfig to ~/.kube/config
  copy:
    src: /tmp/kubeconfig
    dest: "{{ lookup('env', 'HOME') }}/.kube/config"
    mode: "0600"

- name: Verify cluster connectivity
  shell: kubectl get nodes
  changed_when: false
