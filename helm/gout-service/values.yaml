replicaCount: 1

image:
  repository: asia-southeast1-docker.pkg.dev/nt114-q21/gout-llmops-repo/default-service
  tag: "latest"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80

containerPort: 8000

env: {}
envFromSecrets: []

resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "1Gi"
    cpu: "500m"

monitoring:
  enabled: false
