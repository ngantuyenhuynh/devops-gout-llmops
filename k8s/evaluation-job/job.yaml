apiVersion: batch/v1
kind: Job
metadata:
  name: evaluation-job
  namespace: gout-eval
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
      - name: artifact-registry-key
      containers:
      - name: evaluation-job
        image: asia-southeast1-docker.pkg.dev/macro-mender-494903-v0/gout-llmops-repo/evaluation-job:3a3116edfc3a49448334e9ec7b2ea18a8fccf4e4
        imagePullPolicy: Always
        env:
        - name: ORCHESTRATOR_URL
          value: http://eval-orchestrator-app-service.gout-eval.svc.cluster.local:8000/ask
        - name: TESTSET_PATH
          value: /app/data/gout_test_cases_mini.json
        - name: REQUEST_TIMEOUT
          value: "None"
        - name: JUDGE_MODEL
          value: gpt-4o-mini
        - name: EVAL_MODEL_NAME
          value: qwen2.5:1.5b
        - name: QUALITY_GATE_FAITHFULNESS_MIN
          value: "0.40"
        - name: QUALITY_GATE_COMPLETENESS_MIN
          value: "1.0"
        - name: QUALITY_GATE_RAGAS_FAITHFULNESS_MIN
          value: "0.30"
        - name: QUALITY_GATE_RAGAS_RELEVANCE_MIN
          value: "0.30"
        - name: QUALITY_GATE_RAGAS_CONTEXT_RECALL_MIN
          value: "0.60"
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: openai-secret
              key: OPENAI_API_KEY
