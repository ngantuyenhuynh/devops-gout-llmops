apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eval-orchestrator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/ngantuyenhuynh/devops-gout-llmops.git'
    targetRevision: main
    path: helm/gout-service
    helm:
      valueFiles:
        - ../../k8s/eval-orchestrator-values.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: gout-eval
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
