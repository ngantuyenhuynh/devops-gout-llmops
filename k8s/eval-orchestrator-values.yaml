image:
  repository: asia-southeast1-docker.pkg.dev/macro-mender-494903-v0/gout-llmops-repo/eval-orchestrator
  tag: "7c03ff1a0da6a36b771dabff22dd58b8c96b7108"
containerPort: 8000
service:
  port: 8000
resources:
  requests:
    memory: "512Mi"
    cpu: "200m"
  limits:
    memory: "4Gi"
    cpu: "2"

monitoring:
  enabled: true
env:
  LANGFUSE_HOST: "https://cloud.langfuse.com"
envFromSecrets:
  - name: OPENAI_API_KEY
    secretName: openai-secret
    secretKey: OPENAI_API_KEY
  - name: LANGFUSE_SECRET_KEY
    secretName: langfuse-secret
    secretKey: secret-key
  - name: LANGFUSE_PUBLIC_KEY
    secretName: langfuse-secret
    secretKey: public-key
