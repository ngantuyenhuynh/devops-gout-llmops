apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-worker
  namespace: gout-eval
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama-worker
  template:
    metadata:
      labels:
        app: ollama-worker
    spec:
      nodeSelector:
        role: worker-ai
      containers:
      - name: ollama
        image: ollama/ollama:0.6.2
        ports:
        - containerPort: 11434
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "5Gi"
            cpu: "3000m"
        volumeMounts:
        - name: ollama-storage
          mountPath: /root/.ollama
      volumes:
      - name: ollama-storage
        hostPath:
          path: /mnt/data/ollama
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: ollama-service
  namespace: gout-eval
spec:
  selector:
    app: ollama-worker
  ports:
    - protocol: TCP
      port: 11434 # Cổng giao tiếp tiêu chuẩn của Ollama
      targetPort: 11434
