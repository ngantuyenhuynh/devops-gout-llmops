apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
  namespace: gout-eval
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
    spec:
      nodeSelector:
        role: worker-ai
      containers:
      - name: qdrant
        image: qdrant/qdrant:v1.13.2
        ports:
        - containerPort: 6333
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "2Gi"
            cpu: "1"
        volumeMounts:
        - name: qdrant-storage
          mountPath: /qdrant/storage
      volumes:
      - name: qdrant-storage
        hostPath:
          path: /mnt/data/qdrant
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant-service
  namespace: gout-eval
spec:
  selector:
    app: qdrant
  ports:
    - protocol: TCP
      port: 6333
      targetPort: 6333
