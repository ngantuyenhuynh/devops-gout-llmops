apiVersion: batch/v1
kind: Job
metadata:
  name: gout-ingestion-job
  namespace: gout-eval
spec:
  template:
    spec:
      imagePullSecrets:
      - name: artifact-registry-key
      containers:
      - name: ingestion-container
        # Nhớ thay YOUR_PROJECT_ID bằng macro-mender-494903-v0
        image: asia-southeast1-docker.pkg.dev/macro-mender-494903-v0/gout-llmops-repo/data-ingestion:14afc4b724c4abe9e8f524ea9d74e96721b8b117
        imagePullPolicy: Always
      restartPolicy: OnFailure
  # Tự động xóa Job sau khi chạy xong 100 giây để sạch cụm K8s
  ttlSecondsAfterFinished: 100
