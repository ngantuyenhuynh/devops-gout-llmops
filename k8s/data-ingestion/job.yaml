apiVersion: batch/v1
kind: Job
metadata:
  name: gout-ingestion-job
  namespace: gout-eval
spec:
  template:
    spec:
      imagePullSecrets:
      - name: artifact-registry-key
      containers:
      - name: ingestion-container
        # Nhớ thay YOUR_PROJECT_ID bằng macro-mender-494903-v0
        image: asia-southeast1-docker.pkg.dev/macro-mender-494903-v0/gout-llmops-repo/data-ingestion:dc8b5d16803878a045847d8fd58f42e51cd8196a
        imagePullPolicy: Always
      restartPolicy: OnFailure
  # Tự động xóa Job sau khi chạy xong 100 giây để sạch cụm K8s
  ttlSecondsAfterFinished: 100
