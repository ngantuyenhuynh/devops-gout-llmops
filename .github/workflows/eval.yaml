name: Full RAG Evaluation

on:
  schedule:
    # Run nightly at 01:00 UTC for continuous evaluation.
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: gout-eval-namespace-lock
  cancel-in-progress: false

env:
  REGION: ${{ vars.GCP_REGION }}
  K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}
  EVALUATION_JOB_NAME: evaluation-job
  FULL_TESTSET_PATH: /app/data/gout_test_cases.json
  EVAL_TIMEOUT_SECONDS: "18000"
  POLL_INTERVAL_SECONDS: "120"

jobs:
  full-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate required configuration
        run: |
          missing=""
          for var_name in REGION K8S_NAMESPACE; do
            if [ -z "${!var_name}" ]; then
              missing="$missing $var_name"
            fi
          done
          if [ -z "${{ secrets.KUBECONFIG_B64 }}" ]; then
            missing="$missing KUBECONFIG_B64(secret)"
          fi
          if [ -n "$missing" ]; then
            echo "Missing required GitHub Variables/Secrets:$missing"
            exit 1
          fi

      - name: Setup kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Pull Evaluation Model in Ollama
        run: |
          MODEL_NAME=$(awk '/name: EVAL_MODEL_NAME/{getline; sub(/^[[:space:]]*value:[[:space:]]*/, "", $0); print; exit}' k8s/evaluation-job/job.yaml)
          kubectl exec -n "$K8S_NAMESPACE" deployment/ollama-worker -- ollama pull "$MODEL_NAME"

      - name: Run Full Evaluation Job
        run: |
          TMP_JOB_FILE="$(mktemp)"
          cp k8s/evaluation-job/job.yaml "$TMP_JOB_FILE"
          sed -i "s|gout_test_cases_mini.json|$(basename "$FULL_TESTSET_PATH")|g" "$TMP_JOB_FILE"

          kubectl delete job "$EVALUATION_JOB_NAME" -n "$K8S_NAMESPACE" --ignore-not-found=true
          kubectl apply -f "$TMP_JOB_FILE"

          echo "Waiting for full evaluation to complete (up to $((EVAL_TIMEOUT_SECONDS/3600)) hours)..."

          elapsed=0
          while [ "$elapsed" -lt "$EVAL_TIMEOUT_SECONDS" ]; do
            status=$(kubectl get job "$EVALUATION_JOB_NAME" -n "$K8S_NAMESPACE" -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}' 2>/dev/null || echo "Unknown")
            failed=$(kubectl get job "$EVALUATION_JOB_NAME" -n "$K8S_NAMESPACE" -o jsonpath='{.status.conditions[?(@.type=="Failed")].status}' 2>/dev/null || echo "Unknown")

            if [ "$status" = "True" ]; then
              echo "Full evaluation completed successfully."
              break
            fi

            if [ "$failed" = "True" ]; then
              echo "Full evaluation job failed. Printing logs..."
              kubectl logs job/"$EVALUATION_JOB_NAME" -n "$K8S_NAMESPACE" || true
              exit 1
            fi

            echo "Still running... elapsed $((elapsed/60)) minutes"
            sleep "$POLL_INTERVAL_SECONDS"
            elapsed=$((elapsed + POLL_INTERVAL_SECONDS))
          done

          if [ "$elapsed" -ge "$EVAL_TIMEOUT_SECONDS" ]; then
            echo "Timed out after $EVAL_TIMEOUT_SECONDS seconds."
            kubectl logs job/"$EVALUATION_JOB_NAME" -n "$K8S_NAMESPACE" || true
            exit 1
          fi

      # === UPLOAD KẾT QUẢ ĐÁNH GIÁ ===
      - name: Collect Evaluation Results
        if: always()
        run: |
          mkdir -p eval-artifacts
          kubectl logs job/"$EVALUATION_JOB_NAME" -n "$K8S_NAMESPACE" > eval-artifacts/full-evaluation-log.txt 2>&1 || true
          echo "trigger=${{ github.event_name }}" > eval-artifacts/metadata.txt
          echo "commit=${{ github.sha }}" >> eval-artifacts/metadata.txt
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> eval-artifacts/metadata.txt

      - name: Upload Full Evaluation Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-eval-results-${{ github.run_id }}
          path: eval-artifacts/
          retention-days: 90
