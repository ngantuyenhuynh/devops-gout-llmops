name: "CD: Deploy to GKE & Smoke Test"

on:
  workflow_run:
    workflows: ["CI: Build, Scan & Push Services"]
    types: [completed]
    branches: [ "main" ]
  workflow_dispatch:

env:
  PROJECT_ID: ${{ vars.PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  REPO_NAME: ${{ vars.REPO_NAME }}
  K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}

concurrency:
  group: gout-eval-namespace-lock
  cancel-in-progress: false

jobs:
  # ==========================================
  # JOB 1: CHUẨN BỊ INFRA, SECRETS & GITOPS
  # ==========================================
  prepare-and-gitops:
    name: "Prepare & GitOps Push"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      sha: ${{ steps.image_sha.outputs.sha }}
      testset_path: ${{ steps.eval_testset.outputs.testset_path }}
      ingestion_changed: ${{ steps.inject_tags.outputs.ingestion_changed }}
      eval_job_changed: ${{ steps.inject_tags.outputs.eval_job_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Detect Evaluation Testset
        id: eval_testset
        run: |
          CHANGED_TESTSET=$(git diff --name-only "${{ github.event.workflow_run.head_sha || github.sha }}^" "${{ github.event.workflow_run.head_sha || github.sha }}" | grep -E '^data/gout_test_cases(_mini)?\.json(l)?$' | head -n 1 || true)
          if [ -n "$CHANGED_TESTSET" ]; then
            TESTSET_PATH="/app/${CHANGED_TESTSET}"
            echo "Phát hiện testset thay đổi: $CHANGED_TESTSET"
          else
            TESTSET_PATH="/app/data/gout_test_cases_mini.json"
            echo "Không có testset mới thay đổi, dùng mặc định: $TESTSET_PATH"
          fi
          echo "testset_path=$TESTSET_PATH" >> "$GITHUB_OUTPUT"

      - name: Resolve Image SHA
        id: image_sha
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Sẽ deploy image với SHA: $SHA"

      - name: Inject SHA Tags into K8s Manifests
        id: inject_tags
        run: |
          SHA="${{ steps.image_sha.outputs.sha }}"
          BASE_SHA="${{ github.event.workflow_run.before }}"
          HEAD_SHA="${{ steps.image_sha.outputs.sha }}"
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="${HEAD_SHA}^"
          fi
          
          # Đảm bảo có đủ lịch sử commit để diff
          git fetch origin $BASE_SHA --depth=1 || true
          
          echo "Diffing $BASE_SHA...$HEAD_SHA"
          CHANGED_FILES=$(git diff --name-only $BASE_SHA $HEAD_SHA || echo "")
          echo "Changed files: $CHANGED_FILES"
          
          if echo "$CHANGED_FILES" | grep -qE '^src/eval-orchestrator|^k8s/eval-orchestrator-values.yaml'; then
            sed -i "s|tag: \".*\"|tag: \"$SHA\"|g" k8s/eval-orchestrator-values.yaml
            echo "Updated eval-orchestrator to $SHA"
          fi
          
          if echo "$CHANGED_FILES" | grep -qE '^src/ui|^k8s/gout-ui-values.yaml'; then
            sed -i "s|tag: \".*\"|tag: \"$SHA\"|g" k8s/gout-ui-values.yaml
            echo "Updated ui to $SHA"
          fi
          
          if echo "$CHANGED_FILES" | grep -qE '^src/data-ingestion|^k8s/data-ingestion'; then
            find k8s/ -type f -name "*.yaml" -exec sed -i "s|\(image: .*/data-ingestion\):[^ ]*|\1:$SHA|g" {} +
            echo "Updated data-ingestion to $SHA"
            echo "ingestion_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "ingestion_changed=false" >> "$GITHUB_OUTPUT"
          fi
          
          if echo "$CHANGED_FILES" | grep -qE '^src/evaluation-job|^k8s/evaluation-job'; then
            find k8s/ -type f -name "*.yaml" -exec sed -i "s|\(image: .*/evaluation-job\):[^ ]*|\1:$SHA|g" {} +
            echo "Updated evaluation-job to $SHA"
            echo "eval_job_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "eval_job_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync Data ConfigMap
        run: |
          kubectl create configmap gout-data-config \
            --from-file=data/gout_test_cases.json \
            --namespace=${{ env.K8S_NAMESPACE }} \
            --dry-run=client -o yaml | kubectl replace --force -f -

      - name: Upsert imagePullSecret for Artifact Registry
        run: |
          for ns in ${{ env.K8S_NAMESPACE }} monitoring; do
            kubectl create secret docker-registry artifact-registry-key \
              --docker-server=${{ env.REGION }}-docker.pkg.dev \
              --docker-username=_json_key \
              --docker-password='${{ secrets.GCP_SA_KEY }}' \
              --namespace=$ns \
              --dry-run=client -o yaml | kubectl apply -f -
          done

      - name: Upsert Langfuse secret
        run: |
          kubectl create secret generic langfuse-secret \
            --from-literal=secret-key='${{ secrets.LANGFUSE_SECRET_KEY }}' \
            --from-literal=public-key='${{ secrets.LANGFUSE_PUBLIC_KEY }}' \
            --namespace=${{ env.K8S_NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Upsert OpenAI secret
        run: |
          kubectl create secret generic openai-secret \
            --from-literal=OPENAI_API_KEY='${{ secrets.OPENAI_API_KEY }}' \
            --namespace=${{ env.K8S_NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Upsert Telegram secret
        run: |
          kubectl create secret generic telegram-secret \
            --from-literal=bot-token='${{ secrets.TELEGRAM_BOT_TOKEN }}' \
            --namespace=monitoring \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy infrastructure services
        run: |
          kubectl apply -f k8s/vector-db/qdrant.yaml
          kubectl apply -f k8s/inference-worker/ollama.yaml

      - name: Push GitOps changes
        run: |
          SHA="${{ steps.image_sha.outputs.sha }}"
          TESTSET_PATH="${{ steps.eval_testset.outputs.testset_path }}"
          
          # Cập nhật Testset trước khi pull/commit
          sed -i "s|value: /app/data/.*\.json.*|value: $TESTSET_PATH|g" k8s/evaluation-job/job.yaml
          
          git config user.email "ci@github.com"
          git config user.name "GitHub Actions"
          
          # Kiểm tra nếu có thay đổi thì mới stash
          if [ -n "$(git status --porcelain)" ]; then
            echo "Phát hiện thay đổi local, đang stash..."
            git stash
            git pull --rebase origin main
            git stash pop
          else
            echo "Không có thay đổi local, pull trực tiếp..."
            git pull --rebase origin main
          fi
          
          git add k8s/
          git commit -m "cd: GitOps update images to $SHA [skip ci]" || echo "No changes to commit"
          git push origin main

  # ==========================================
  # JOB 2: RUN DATA INGESTION
  # ==========================================
  run-data-ingestion:
    name: "Run Data Ingestion"
    needs: prepare-and-gitops
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Run and wait for Data Ingestion Job
        run: |
          if [ "${{ needs.prepare-and-gitops.outputs.ingestion_changed }}" = "true" ]; then
            SHA="${{ needs.prepare-and-gitops.outputs.sha }}"
            sed -i "s|\(image: .*/data-ingestion\):[^ ]*|\1:$SHA|g" k8s/data-ingestion/job.yaml
          fi
          
          kubectl delete job gout-ingestion-job -n ${{ env.K8S_NAMESPACE }} --ignore-not-found=true
          kubectl wait --for=delete job/gout-ingestion-job -n ${{ env.K8S_NAMESPACE }} --timeout=60s 2>/dev/null || true
          kubectl apply -f k8s/data-ingestion/job.yaml
          echo "Waiting for ingestion job to complete..."
          if ! kubectl wait --for=condition=complete job/gout-ingestion-job -n ${{ env.K8S_NAMESPACE }} --timeout=600s; then
            echo "Ingestion job thất bại!"
            kubectl logs job/gout-ingestion-job -n ${{ env.K8S_NAMESPACE }} || true
            exit 1
          fi
          echo "Ingestion hoàn tất!"

  # ==========================================
  # JOB 3: RUN SMOKE TEST
  # ==========================================
  run-smoke-test:
    name: "Run Smoke Test"
    needs: [prepare-and-gitops, run-data-ingestion]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Extract Evaluation Config
        id: eval_config
        run: |
          MODEL_NAME=$(awk '/name: EVAL_MODEL_NAME/{getline; sub(/^[[:space:]]*value:[[:space:]]*/, "", $0); print; exit}' k8s/evaluation-job/job.yaml)
          if [ -z "$MODEL_NAME" ]; then
            echo "Không tìm thấy EVAL_MODEL_NAME trong k8s/evaluation-job/job.yaml"
            exit 1
          fi
          echo "model_name=$MODEL_NAME" >> "$GITHUB_OUTPUT"
          echo "Đánh giá model: $MODEL_NAME"

      - name: Wait for Ollama rollout
        run: kubectl rollout status deployment/ollama-worker -n ${{ env.K8S_NAMESPACE }} --timeout=600s

      - name: Pull Evaluation Model in Ollama
        run: |
          MODEL="${{ steps.eval_config.outputs.model_name }}"
          echo "Kiểm tra model $MODEL trong Ollama..."
          if kubectl exec -n ${{ env.K8S_NAMESPACE }} deployment/ollama-worker -- ollama list 2>/dev/null | grep -q "$MODEL"; then
            echo "Model $MODEL đã có sẵn, bỏ qua bước pull."
          else
            echo "Đang tải model $MODEL vào Ollama..."
            kubectl exec -n ${{ env.K8S_NAMESPACE }} deployment/ollama-worker -- ollama pull "$MODEL"
          fi

      - name: Run Smoke Test (Mini Eval)
        run: |
          kubectl delete job evaluation-job -n ${{ env.K8S_NAMESPACE }} --ignore-not-found=true
          kubectl wait --for=delete job/evaluation-job -n ${{ env.K8S_NAMESPACE }} --timeout=60s 2>/dev/null || true
          
          # Cập nhật Testset và SHA từ Job 1 trước khi apply
          TESTSET_PATH="${{ needs.prepare-and-gitops.outputs.testset_path }}"
          sed -i "s|value: /app/data/.*\.json.*|value: $TESTSET_PATH|g" k8s/evaluation-job/job.yaml
          
          if [ "${{ needs.prepare-and-gitops.outputs.eval_job_changed }}" = "true" ]; then
            SHA="${{ needs.prepare-and-gitops.outputs.sha }}"
            sed -i "s|\(image: .*/evaluation-job\):[^ ]*|\1:$SHA|g" k8s/evaluation-job/job.yaml
          fi
          
          kubectl apply -f k8s/evaluation-job/job.yaml
          if ! kubectl wait --for=condition=complete job/evaluation-job -n ${{ env.K8S_NAMESPACE }} --timeout=600s; then
            echo "Smoke test thất bại cho model ${{ steps.eval_config.outputs.model_name }}!"
            kubectl logs job/evaluation-job -n ${{ env.K8S_NAMESPACE }} || true
            exit 1
          fi
          echo "Smoke test thành công!"
          kubectl logs job/evaluation-job -n ${{ env.K8S_NAMESPACE }} || true

      - name: Collect Evaluation Results
        if: always()
        run: |
          mkdir -p eval-artifacts
          kubectl logs job/evaluation-job -n ${{ env.K8S_NAMESPACE }} > eval-artifacts/evaluation-log.txt 2>&1 || true
          echo "commit=${{ needs.prepare-and-gitops.outputs.sha }}" > eval-artifacts/metadata.txt
          echo "model=${{ steps.eval_config.outputs.model_name }}" >> eval-artifacts/metadata.txt
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> eval-artifacts/metadata.txt

      - name: Upload Evaluation Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ needs.prepare-and-gitops.outputs.sha }}
          path: eval-artifacts/
          retention-days: 30
