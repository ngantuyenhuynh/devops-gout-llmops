name: "CD: Deploy to GKE & Smoke Test"

on:
  workflow_run:
    workflows: ["CI: Build, Scan & Push Services"]
    types: [completed]
    branches: [ "main" ]
  workflow_dispatch:

env:
  PROJECT_ID: ${{ vars.PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  REPO_NAME: ${{ vars.REPO_NAME }}
  GKE_CLUSTER: ${{ vars.GKE_CLUSTER }}
  GKE_LOCATION: ${{ vars.GKE_LOCATION }}
  K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}

concurrency:
  group: gout-eval-namespace-lock
  cancel-in-progress: false

jobs:
  deploy-and-evaluate:
    runs-on: ubuntu-latest
    # Chỉ chạy khi CI thành công (hoặc khi trigger thủ công)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

    - name: Get GKE credentials
      uses: google-github-actions/get-gke-credentials@v2
      with:
        cluster_name: ${{ env.GKE_CLUSTER }}
        location: ${{ env.GKE_LOCATION }}

    # === BƯỚC 1: CHUẨN BỊ TRIỂN KHAI ===
    - name: Detect Evaluation Testset
      id: eval_testset
      run: |
        CHANGED_TESTSET=$(git diff --name-only "${{ github.event.workflow_run.head_sha || github.sha }}^" "${{ github.event.workflow_run.head_sha || github.sha }}" | grep -E '^data/gout_test_cases(_mini)?\.json(l)?$' | head -n 1 || true)
        if [ -n "$CHANGED_TESTSET" ]; then
          TESTSET_PATH="/app/${CHANGED_TESTSET}"
          echo "Phát hiện testset thay đổi: $CHANGED_TESTSET"
        else
          TESTSET_PATH="/app/data/gout_test_cases_mini.json"
          echo "Không có testset mới thay đổi, dùng mặc định: $TESTSET_PATH"
        fi
        echo "testset_path=$TESTSET_PATH" >> "$GITHUB_OUTPUT"

    - name: Resolve Image SHA
      id: image_sha
      run: |
        # Dùng SHA từ CI workflow nếu có, nếu không thì dùng SHA hiện tại
        SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
        echo "sha=$SHA" >> "$GITHUB_OUTPUT"
        echo "Sẽ deploy image với SHA: $SHA"

    - name: Inject SHA Tags into K8s Manifests
      run: |
        SHA="${{ steps.image_sha.outputs.sha }}"
        echo "Ép file cấu hình dùng Image SHA: $SHA..."
        # [ĐÃ SỬA] Chỉ còn ép tag cho Data Ingestion và Eval Job
        find k8s/ -type f -name "*.yaml" -exec sed -i "s|\(image: .*/data-ingestion\):latest|\1:$SHA|g" {} +
        find k8s/ -type f -name "*.yaml" -exec sed -i "s|\(image: .*/evaluation-job\):latest|\1:$SHA|g" {} +

    - name: Sync Data ConfigMap
      run: |
        kubectl create configmap gout-data-config \
          --from-file=data/gout_test_cases.json \
          --namespace=${{ env.K8S_NAMESPACE }} \
          --dry-run=client -o yaml | kubectl replace --force -f -

    # === BƯỚC 2: UPSERT SECRETS ===
    - name: Upsert Langfuse secret
      run: |
        kubectl create secret generic langfuse-secret \
          --from-literal=secret-key='${{ secrets.LANGFUSE_SECRET_KEY }}' \
          --from-literal=public-key='${{ secrets.LANGFUSE_PUBLIC_KEY }}' \
          --namespace=${{ env.K8S_NAMESPACE }} \
          --dry-run=client -o yaml | kubectl apply -f -

    - name: Upsert OpenAI secret
      run: |
        # [ĐÃ SỬA] Đảm bảo dùng khóa in hoa OPENAI_API_KEY
        kubectl create secret generic openai-secret \
          --from-literal=OPENAI_API_KEY='${{ secrets.OPENAI_API_KEY }}' \
          --namespace=${{ env.K8S_NAMESPACE }} \
          --dry-run=client -o yaml | kubectl apply -f -

    - name: Upsert SMTP secret
      run: |
        kubectl create secret generic smtp-secret \
          --from-literal=username='${{ secrets.SMTP_AUTH_USERNAME }}' \
          --from-literal=password='${{ secrets.SMTP_AUTH_PASSWORD }}' \
          --namespace=monitoring \
          --dry-run=client -o yaml | kubectl apply -f -

# === BƯỚC 3: CẬP NHẬT GITOPS ===
    - name: Update GitOps Config
      run: |
        SHA="${{ steps.image_sha.outputs.sha }}"
        
        # 1. Các dịch vụ Infrastructure (Giữ nguyên kubectl apply)
        kubectl apply -f k8s/vector-db/qdrant.yaml
        kubectl apply -f k8s/inference-worker/ollama.yaml
        
        kubectl delete job gout-ingestion-job -n ${{ env.K8S_NAMESPACE }} --ignore-not-found=true
        kubectl apply -f k8s/data-ingestion/job.yaml

        # 2. CẬP NHẬT MÃ SHA VÀO FILE HELM VALUES CHO ARGOCD
        sed -i "s|tag: \".*\"|tag: \"$SHA\"|g" k8s/eval-orchestrator-values.yaml
        sed -i "s|tag: \".*\"|tag: \"$SHA\"|g" k8s/gout-ui-values.yaml
        
        # 3. Ép tag cho các file yaml tĩnh còn lại
        find k8s/ -type f -name "*.yaml" -exec sed -i "s|\(image: .*/data-ingestion\):latest|\1:$SHA|g" {} +
        find k8s/ -type f -name "*.yaml" -exec sed -i "s|\(image: .*/evaluation-job\):latest|\1:$SHA|g" {} +

        # 4. PUSH NGƯỢC VỀ GIT ĐỂ ARGOCD TỰ SYNC MÀ KHÔNG BỊ ĐÁNH NHAU
        git config user.email "ci@github.com"
        git config user.name "GitHub Actions"
        git add k8s/
        git commit -m "cd: GitOps update images to $SHA" || echo "No changes to commit"
        git push origin main
