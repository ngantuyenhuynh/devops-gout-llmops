name: "Template: Build, Scan & Push"

on:
  workflow_call:
    inputs:
      service_name:
        description: "Tên của Docker Image (vd: eval-orchestrator)"
        required: true
        type: string
      build_context:
        description: "Thư mục chứa code để build (vd: ./src/eval-orchestrator)"
        required: true
        type: string
      dockerfile_path:
        description: "Đường dẫn trỏ tới file Dockerfile"
        required: true
        type: string
    # Bắt buộc phải có phần này để nhận Secret từ file gọi nó
    secrets:
      GCP_CREDENTIALS:
        required: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'
          token_format: 'access_token'
          
      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      
      - name: Build & Load
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.build_context }}
          file: ${{ inputs.dockerfile_path }}
          load: true
          tags: ${{ inputs.service_name }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ inputs.service_name }}:test'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Push to Artifact Registry
        run: |
          IMAGE_PATH=${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.PROJECT_ID }}/${{ vars.REPO_NAME }}/${{ inputs.service_name }}
          docker tag ${{ inputs.service_name }}:test $IMAGE_PATH:${{ github.sha }}
          docker push $IMAGE_PATH:${{ github.sha }}
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            docker tag ${{ inputs.service_name }}:test $IMAGE_PATH:latest
            docker push $IMAGE_PATH:latest
          fi
