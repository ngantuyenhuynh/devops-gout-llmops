name: "CI: Build, Scan & Push Services"

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'k8s/**'
      - '.github/workflows/ci.yaml'
  pull_request:
    branches: [ "main" ]

jobs:
  # Vẫn giữ nguyên quét mã nguồn
  security-audit:
    name: "Audit: Repository Security Scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

  # GỌI KHUÔN ĐÚC CHO ORCHESTRATOR
  build-orchestrator:
    needs: security-audit
    uses: ./.github/workflows/reusable-build.yaml
    with:
      service_name: "eval-orchestrator"
      build_context: "./src/eval-orchestrator"
      dockerfile_path: "./src/eval-orchestrator/Dockerfile"
    secrets: inherit # Tự động truyền toàn bộ secret xuống cho khuôn

  # GỌI KHUÔN ĐÚC CHO UI
  build-ui:
    needs: security-audit
    uses: ./.github/workflows/reusable-build.yaml
    with:
      service_name: "gout-ui"
      build_context: "./src/ui"
      dockerfile_path: "./src/ui/Dockerfile"
    secrets: inherit

  # GỌI KHUÔN ĐÚC CHO INGESTION
  build-ingestion:
    needs: security-audit
    uses: ./.github/workflows/reusable-build.yaml
    with:
      service_name: "data-ingestion"
      build_context: "."
      dockerfile_path: "./src/data-ingestion/Dockerfile"
    secrets: inherit

  # GỌI KHUÔN ĐÚC CHO EVAL JOB
  build-eval-job:
    needs: security-audit
    uses: ./.github/workflows/reusable-build.yaml
    with:
      service_name: "evaluation-job"
      build_context: "."
      dockerfile_path: "./src/evaluation-job/Dockerfile"
    secrets: inherit
