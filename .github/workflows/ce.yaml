name: "CE: Continuous Evaluation (Data Trigger)"

on:
  push:
    branches: [ "main" ]
    paths:
      - 'data/**'                  # 🌟 Kích hoạt RIÊNG khi có thay đổi dữ liệu test
      - '.github/workflows/ce.yaml'

env:
  PROJECT_ID: ${{ vars.PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  REPO_NAME: ${{ vars.REPO_NAME }}
  K8S_NAMESPACE: "gout-eval"

jobs:
  continuous-evaluation:
    name: "Run Automated RAGAS Evaluation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ==========================================
      # BƯỚC 1: BUILD LẠI DUY NHẤT IMAGE BOT CHẤM ĐIỂM (CẬP NHẬT DATA MỚI)
      # ==========================================
      - uses: docker/setup-buildx-action@v3
      
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'
          token_format: 'access_token'
          
      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      
      - name: Build & Push Evaluation Job Only
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/evaluation-job/Dockerfile
          push: true
          tags: |
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/evaluation-job:${{ github.sha }}
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/evaluation-job:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ==========================================
      # BƯỚC 2: KẾT NỐI GKE VÀ KÍCH HOẠT CHẤM ĐIỂM
      # ==========================================
      - name: Setup kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Update evaluation-job image SHA
        run: |
          sed -i "s|\(image: .*/evaluation-job\):.*|\1:${{ github.sha }}|g" k8s/evaluation-job/job.yaml

      - name: Pull Evaluation Model in Ollama
        run: |
          MODEL_NAME=$(awk '/name: EVAL_MODEL_NAME/{getline; sub(/^[[:space:]]*value:[[:space:]]*/, "", $0); print; exit}' k8s/evaluation-job/job.yaml)
          if kubectl exec -n ${{ env.K8S_NAMESPACE }} deployment/ollama-worker -- ollama list 2>/dev/null | grep -q "$MODEL_NAME"; then
            echo "Model $MODEL_NAME đã có sẵn, bỏ qua bước pull."
          else
            kubectl exec -n ${{ env.K8S_NAMESPACE }} deployment/ollama-worker -- ollama pull "$MODEL_NAME"
          fi

      - name: Run CE Smoke Test Job
        run: |
          kubectl delete job evaluation-job -n ${{ env.K8S_NAMESPACE }} --ignore-not-found=true

          # Đợi job cũ xóa xong để tránh race condition
          kubectl wait --for=delete job/evaluation-job \
            -n ${{ env.K8S_NAMESPACE }} --timeout=60s 2>/dev/null || true

          kubectl apply -f k8s/evaluation-job/job.yaml
          
          # Đợi tối đa 1 tiếng cho tiến trình chấm điểm RAGAS hoàn tất
          if ! kubectl wait --for=condition=complete job/evaluation-job -n ${{ env.K8S_NAMESPACE }} --timeout=3600s; then
            echo "❌ Bài thực nghiệm CE thất bại hoặc không vượt qua Quality Gate!"
            kubectl logs job/evaluation-job -n ${{ env.K8S_NAMESPACE }} || true
            exit 1
          fi
          
          echo "✅ Bài thực nghiệm CE thành công tốt đẹp!"
          kubectl logs job/evaluation-job -n ${{ env.K8S_NAMESPACE }} || true
